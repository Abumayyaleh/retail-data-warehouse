<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='650' viewBox='0 0 1200 650' role='img'><style>text{font-family:Arial,sans-serif}</style><defs><marker id='arrow' markerWidth='9' markerHeight='9' refX='8' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8' fill='none' stroke='#64748b' stroke-width='1.5'/></marker></defs><rect width='1200' height='650' fill='#f1f5f9'/><title>Retail warehouse architecture</title><text x='50' y='58' font-size='30' font-weight='700' fill='#0f172a'>Retail Data Warehouse</text><text x='50' y='91' font-size='17' fill='#475569'>PostgreSQL | Raw source values to analytical sales measures</text><rect x='50' y='170' width='320' height='230' rx='14' fill='white' stroke='#9a5c22' stroke-width='2'/><rect x='50' y='170' width='320' height='44' rx='14' fill='#9a5c22'/><text x='68' y='199' fill='white' font-size='18' font-weight='700'>BRONZE / Raw</text><text x='68' y='242' fill='#334155' font-size='15'>Six CSV source tables</text><text x='68' y='267' fill='#334155' font-size='15'>customers · employees · products</text><text x='68' y='292' fill='#334155' font-size='15'>stores · orders · order_items</text><text x='68' y='317' fill='#334155' font-size='15'>All source columns stored as TEXT</text><text x='68' y='342' fill='#334155' font-size='15'>Load separately when files change</text><rect x='440' y='170' width='320' height='230' rx='14' fill='white' stroke='#475569' stroke-width='2'/><rect x='440' y='170' width='320' height='44' rx='14' fill='#475569'/><text x='458' y='199' fill='white' font-size='18' font-weight='700'>SILVER / Clean</text><text x='458' y='242' fill='#334155' font-size='15'>Six typed relational tables</text><text x='458' y='267' fill='#334155' font-size='15'>Normalize text, dates and numbers</text><text x='458' y='292' fill='#334155' font-size='15'>Rank and deduplicate business IDs</text><text x='458' y='317' fill='#334155' font-size='15'>Enforce selected relationships</text><text x='458' y='342' fill='#334155' font-size='15'>Filter unmatched orders and items</text><rect x='830' y='170' width='320' height='230' rx='14' fill='white' stroke='#997000' stroke-width='2'/><rect x='830' y='170' width='320' height='44' rx='14' fill='#997000'/><text x='848' y='199' fill='white' font-size='18' font-weight='700'>GOLD / Analytics</text><text x='848' y='242' fill='#334155' font-size='15'>fact_sales + five dimensions</text><text x='848' y='267' fill='#334155' font-size='15'>One row per retained order item</text><text x='848' y='292' fill='#334155' font-size='15'>Surrogate keys and calendar dates</text><text x='848' y='317' fill='#334155' font-size='15'>Sales, discount, cost and margin</text><text x='848' y='342' fill='#334155' font-size='15'>Ready for SQL analysis and BI</text><path d='M370 275 H430 M760 275 H820' stroke='#64748b' stroke-width='2' marker-end='url(#arrow)'/><text x='430' y='145' font-size='15' fill='#334155'>silver.load_silver()</text><text x='820' y='145' font-size='15' fill='#334155'>gold.load_gold()</text><rect x='50' y='452' width='1100' height='130' rx='16' fill='#0f172a'/><text x='78' y='490' font-size='21' fill='white' font-weight='700'>public.refresh_warehouse()</text><text x='78' y='524' font-size='17' fill='#cbd5e1'>Truncate Silver and Gold → restart identities → load Silver → load Gold</text><text x='78' y='553' font-size='16' fill='#cbd5e1'>Bronze is retained. Full refresh; no incremental loads or dimension history.</text></svg>
