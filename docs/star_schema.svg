<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='650' viewBox='0 0 1200 650' role='img'><style>text{font-family:Arial,sans-serif}</style><defs><marker id='arrow' markerWidth='9' markerHeight='9' refX='8' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8' fill='none' stroke='#64748b' stroke-width='1.5'/></marker></defs><rect width='1200' height='650' fill='#f1f5f9'/><title>Retail sales star schema</title><text x='40' y='48' font-size='29' font-weight='700' fill='#0f172a'>Sales star schema</text><text x='40' y='80' font-size='16' fill='#475569'>gold schema | Dimension key → fact foreign key | One dimension row to many sales lines</text><g fill='none' stroke='#64748b' stroke-width='2'><path d='M310 208 H420 M310 418 H420 M860 208 H750 M860 418 H750 M585 510 V550'/></g><rect x='40' y='125' width='270' height='175' rx='14' fill='white' stroke='#0369a1' stroke-width='2'/><rect x='40' y='125' width='270' height='44' rx='14' fill='#0369a1'/><text x='58' y='154' fill='white' font-size='18' font-weight='700'>dim_customers</text><text x='58' y='197' fill='#334155' font-size='15'>PK customer_sk</text><text x='58' y='222' fill='#334155' font-size='15'>UK customer_id</text><text x='58' y='247' fill='#334155' font-size='15'>Name · location · membership</text><rect x='40' y='345' width='270' height='175' rx='14' fill='white' stroke='#0369a1' stroke-width='2'/><rect x='40' y='345' width='270' height='44' rx='14' fill='#0369a1'/><text x='58' y='374' fill='white' font-size='18' font-weight='700'>dim_products</text><text x='58' y='417' fill='#334155' font-size='15'>PK product_sk</text><text x='58' y='442' fill='#334155' font-size='15'>UK product_id</text><text x='58' y='467' fill='#334155' font-size='15'>Category · price · cost</text><rect x='860' y='125' width='295' height='175' rx='14' fill='white' stroke='#0369a1' stroke-width='2'/><rect x='860' y='125' width='295' height='44' rx='14' fill='#0369a1'/><text x='878' y='154' fill='white' font-size='18' font-weight='700'>dim_stores</text><text x='878' y='197' fill='#334155' font-size='15'>PK store_sk</text><text x='878' y='222' fill='#334155' font-size='15'>UK store_id</text><text x='878' y='247' fill='#334155' font-size='15'>Store · location · region</text><rect x='860' y='345' width='295' height='175' rx='14' fill='white' stroke='#0369a1' stroke-width='2'/><rect x='860' y='345' width='295' height='44' rx='14' fill='#0369a1'/><text x='878' y='374' fill='white' font-size='18' font-weight='700'>dim_employees</text><text x='878' y='417' fill='#334155' font-size='15'>PK employee_sk</text><text x='878' y='442' fill='#334155' font-size='15'>UK employee_id</text><text x='878' y='467' fill='#334155' font-size='15'>Name · role · hire date</text><rect x='420' y='115' width='330' height='395' rx='14' fill='white' stroke='#0f172a' stroke-width='2'/><rect x='420' y='115' width='330' height='44' rx='14' fill='#0f172a'/><text x='438' y='144' fill='white' font-size='18' font-weight='700'>fact_sales</text><text x='438' y='187' fill='#334155' font-size='15'>PK sales_fact_id</text><text x='438' y='212' fill='#334155' font-size='15'>UK order_item_id / grain</text><text x='438' y='237' fill='#334155' font-size='15'>order_id / order grouping</text><text x='438' y='262' fill='#334155' font-size='15'>FK customer_sk · product_sk</text><text x='438' y='287' fill='#334155' font-size='15'>FK store_sk · employee_sk</text><text x='438' y='312' fill='#334155' font-size='15'>FK date_key</text><text x='438' y='337' fill='#334155' font-size='15'>quantity · unit_price · unit_cost</text><text x='438' y='362' fill='#334155' font-size='15'>discount_pct · gross_amount</text><text x='438' y='387' fill='#334155' font-size='15'>discount_amount · net_amount</text><text x='438' y='412' fill='#334155' font-size='15'>total_cost · margin_profit</text><text x='438' y='437' fill='#334155' font-size='15'>payment_method · order_status</text><rect x='420' y='550' width='330' height='85' rx='14' fill='white' stroke='#0369a1' stroke-width='2'/><rect x='420' y='550' width='330' height='44' rx='14' fill='#0369a1'/><text x='438' y='579' fill='white' font-size='18' font-weight='700'>dim_date</text><text x='438' y='622' fill='#334155' font-size='15'>PK date_key · UK full_date</text><text x='40' y='566' font-size='14' fill='#475569'>PK = primary key; UK = unique key</text><text x='40' y='591' font-size='14' fill='#475569'>FK = foreign key</text><text x='800' y='566' font-size='14' fill='#475569'>Employee and date may be missing.</text><text x='800' y='591' font-size='14' fill='#475569'>Loader requires other three dimensions.</text></svg>
